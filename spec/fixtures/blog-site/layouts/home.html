<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
  </head>
  <body>
    <main>
      {{ content }}
      <ul>
        {% for post in collections.posts %}<li><a href="{{ post.url }}">{{ post.title }}</a> ({{ post.date }}) — {{ post.excerpt }}</li>
        {% end %}
      </ul>
    </main>
  </body>
</html>
